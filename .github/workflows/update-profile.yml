name: Update profile card

on:
  schedule:
    - cron: "17 3 * * *"   # daily; keeps Uptime and stats fresh
  workflow_dispatch:
  push:
    paths:
      - config.json
      - assets/ascii.txt
      - tools/**

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub stats
        env:
          # Add a PAT (read:user + repo) as the ACCESS_TOKEN secret to include private repos.
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/update_stats.py

      - name: Build SVGs
        run: python tools/build_svg.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json dark_mode.svg light_mode.svg
            git commit -m "chore: refresh profile card"
            git push
          fi
